version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       crm_db
      POSTGRES_USER:     crm_user
      POSTGRES_PASSWORD: crm_pass
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      context: ../crm-backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crm_user:crm_pass@postgres:5432/crm_db
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: change-me-access-secret-min-32-chars
      REFRESH_TOKEN_SECRET: change-me-refresh-secret-min-32-chars
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ../crm-frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-4000}/api/v1

volumes:
  pgdata:
